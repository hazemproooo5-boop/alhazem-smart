name: Platform verification

on:
  push:
    branches:
      - "main"
      - "fix/**"
      - "feat/**"
  pull_request:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        with:
          node-version: 20
        uses: actions/setup-node@v4
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Audit catalog coverage
        run: npm run audit:catalog
      - name: Type check
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Upload catalog audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-audit-${{ github.sha }}
          path: |
            reports/catalog-audit-summary.json
            reports/catalog-audit.csv
          retention-days: 30
          if-no-files-found: warn
